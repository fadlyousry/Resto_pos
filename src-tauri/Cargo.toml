[package]
name = "beitna-pos"
version = "0.1.0"
description = "نظام إدارة مطعم بيتنا"
authors = ["Beitna"]
edition = "2021"

[lib]
name = "beitna_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
