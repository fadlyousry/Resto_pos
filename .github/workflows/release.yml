name: Build signed Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload signed updater release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Resto POS v__VERSION__"
          releaseBody: |
            تحديث جديد لنظام Resto POS (v__VERSION__).

            - إضافة عمود الحجم وخيارات الصنف في سلة المبيعات بشاشة نقطة البيع (POS).
            - إضافة عمود الحجم وخيارات الصنف في تفاصيل الأصناف بنافذة تفاصيل الطلب.
            - تحسين وتنسيق جداول السلة والطلبات واستجابتها لمختلف أحجام الشاشات لتسهيل مراجعة الأصناف بدقة.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
