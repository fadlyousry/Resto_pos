name: Build signed Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload signed updater release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Resto POS v__VERSION__"
          releaseBody: |
            تحديث جديد لنظام Resto POS (v__VERSION__).

            - إضافة قوائم منسدلة أنيقة وتفاعلية في شاشة الطلبات لفلترة الطلبات حسب حالة الطلب وطريقة الدفع (كاش، إنستاباي، فودافون كاش) مع عدادات فورية للطلبات.
            - إمكانية كتابة وتعديل الكمية مباشرة داخل سلة البيع (POS) بالأرقام والكسور دون الاكتفاء بأزرار الزيادة والنقصان.
            - إضافة تقرير شامل ومفصل للأصناف والكميات المباعة يومياً في شاشة التقارير مع إمكانية البحث والفلترة والترتيب وطباعة كشف PDF.
            - حل مشكلة اهتزاز واختفاء شريط التمرير (Scrollbar) في مودال إضافة الوجبة المتقدم على الشاشات الصغيرة وضبط استقرار العرض.
            - تحسينات عامة في الأداء واستقرار النظام.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
